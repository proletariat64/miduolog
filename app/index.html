<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米多错题本</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="app"><nav aria-label="主导航"><div class="brand">米多错题本<small>每次弄懂一点点</small></div><button class="navitem active" data-view="import">＋ 照片录入</button><button class="navitem" data-view="questions">▤ 全部题目 <span id="questionCount" class="badge">0</span></button><button class="navitem" data-view="attention">◇ 待处理 <span id="attentionCount" class="badge">0</span></button><button class="navitem" data-view="review">↻ 复习</button><div id="connection" class="connection">检查本机连接……</div><p class="foot">全部题目都保留<br>原图与学习记录本地保存</p></nav>
<main><header><div><strong id="heading">照片录入</strong><p id="subheading" class="subtitle"></p></div><button id="closePanel" hidden>收起详情</button></header><div id="notice" role="status" aria-live="polite" hidden></div><section id="uploadEntry" class="upload-entry"><h1>把这次的照片放进来</h1><p>整页、局部、题目和答题纸可以一起选。先本地去重，再识别全部题目。</p><button id="open" class="primary">＋ 选择照片并识别</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><p id="uploadStatus" role="status">支持 PNG、JPEG、WebP，每张不超过15MB，一次最多30张。</p><button id="retryUpload" hidden>重试本批上传</button></section><div id="chat" class="chat"></div></main>
<aside id="panel" hidden aria-label="题目详情"><header><strong id="panelTitle">题目详情</strong><button data-action="close-panel" aria-label="关闭题目详情">×</button></header><div id="detail" class="details"></div></aside></div>
<dialog id="editorDialog"><form method="dialog" class="dialog-header"><strong id="dialogTitle"></strong><button aria-label="关闭对话框">×</button></form><div id="dialogBody"></div></dialog><script type="module" src="/client.js"></script></body></html>

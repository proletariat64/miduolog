<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米多错题本</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app"><nav><div class="brand">米多错题本<small>每次弄懂一点点</small></div><button class="navitem active" data-view="import">＋　录入错题</button><button class="navitem" data-view="pending">▤　待核对 <span class="badge" id="pendingCount">0</span></button><button class="navitem" data-view="library">▦　错题库 <span class="badge" id="libraryCount">0</span></button><button class="navitem" data-view="review">↻　复习</button><div class="label">本机 Codex</div><div class="connection" id="connection">检查连接……</div><div class="foot">本地保存 · 数学 / 语文<br>已接入真实图片识别</div></nav>
<main><header><div><strong id="heading">录入错题</strong><div class="subtitle" id="subheading">打开一张作业图片，从核对开始</div></div><button id="toggle" hidden>收起题目详情 →</button></header><div class="chat" id="chat"></div><div class="composer" id="composer"><p class="muted">图片将由本机 Codex 连接的模型识别，原图与结果保存在本地。当前先支持单张整页拆题。</p><div class="composerbar"><button class="primary" id="open">＋ 打开图片并识别</button><span class="muted" id="progress">等待选择图片</span></div></div></main>
<aside id="panel" hidden><header><strong>题目详情</strong><button id="close" aria-label="收起题目详情">×</button></header><div class="details"><div class="sectiontitle">原图</div><a id="originalLink" target="_blank" rel="noopener"><img id="original" class="original" alt="题目原始图片"></a><div class="sectiontitle">题目</div><div class="math-preview" id="questionPreview"></div><details><summary>修改识别内容</summary><textarea class="editable" id="questionEdit" aria-label="修改题目"></textarea></details><div class="sectiontitle">原作答</div><div class="math-preview" id="answerPreview"></div><details><summary>修改原作答</summary><textarea class="editable" id="answerEdit" aria-label="修改原作答"></textarea></details><div class="sectiontitle">学科与知识点</div><select id="subjectEdit" aria-label="学科"><option>数学</option><option>语文</option><option>其他</option></select><input id="knowledgeEdit" aria-label="知识点"><div class="sectiontitle">错误判断与依据</div><div class="analysis" id="errorText"></div><div class="sectiontitle">可能错因 · 待确认</div><div class="analysis" id="causeText"></div><div class="sectiontitle">本页识别提醒</div><div id="unclear" class="muted"></div><div class="actions detail-actions"><button id="save">保存修改</button><button id="confirm" class="primary">核对无误，进入复习库</button></div></div></aside></div><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><script type="module" src="/client.js"></script></body></html>
